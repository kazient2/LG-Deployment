  minio:
    container_name: minio
    image: minio/minio:latest
    restart: always
    ports:
      - ${MINIO_HOST_API_PORT}:${MINIO_API_PORT}
      - ${MINIO_HOST_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIOURL=${MINIOURL}
      - MINIOREGION=${MINIOREGION}
      - MINIO_SETUP_SCRIPT_PATH=${MINIO_SETUP_SCRIPT_PATH}
    volumes:
      - ${MINIO_HOST_DATA_PATH}:${MINIO_DATA_PATH}
      - ${MINIO_HOST_SETUP_SCRIPT_PATH}:${MINIO_SETUP_SCRIPT_PATH}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      minio server ${MINIO_DATA_PATH} --console-address :${MINIO_CONSOLE_PORT} &
      until curl -s ${MINIOURL}/minio/health/ready > /dev/null; do
        echo '⏳ Waiting for MinIO to be ready...';
        sleep 2;
      done;
      echo '✅ MinIO is live. Running init script...';
      chmod +x ${MINIO_SETUP_SCRIPT_PATH};
      ${MINIO_SETUP_SCRIPT_PATH};
      wait
      "

